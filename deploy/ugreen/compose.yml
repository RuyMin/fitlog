name: fitlog-nas
services:
  # Own tailnet device ("fitlog"). Funnel publishes only this device at
  # https://fitlog.<tailnet>.ts.net; the NAS itself stays private. See FUNNEL.md.
  tailscale:
    image: tailscale/tailscale:${TAILSCALE_IMAGE_TAG:-stable}
    hostname: ${TS_HOSTNAME:-fitlog}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ${TS_HOSTNAME:-fitlog}
      TS_STATE_DIR: /var/lib/tailscale
      # Directory mount so edits to serve.json (e.g. AllowFunnel false) apply without restart.
      TS_SERVE_CONFIG: /serve/serve.json
    volumes:
      - /volume1/docker/fitlog/tailscale:/var/lib/tailscale
      - ./tailscale:/serve:ro
    ports:
      # FitLog shares this network namespace. Host-only, for health checks;
      # users reach the app through the Funnel HTTPS address.
      - "127.0.0.1:51881:51881"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  fitlog:
    image: ghcr.io/ruymin/fitlog:${FITLOG_IMAGE_TAG:-latest}
    platform: linux/amd64
    user: "10001:10001"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "51881", "--workers", "1"]
    network_mode: service:tailscale
    environment:
      FITLOG_DATA_DIR: /app/data
      FITLOG_PUBLIC_URL: ${FITLOG_PUBLIC_URL:-}
      FITLOG_OWNER_EMAIL: ${FITLOG_OWNER_EMAIL:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET_FILE: ${GOOGLE_OAUTH_CLIENT_SECRET_FILE:-/app/config/google-oauth-client-secret}
      FITLOG_SECRET_KEY: ${FITLOG_SECRET_KEY:-}
      FITLOG_AI_MODEL: ${FITLOG_AI_MODEL:-claude-opus-5-5}
      FITLOG_AI_DAILY_LIMIT: ${FITLOG_AI_DAILY_LIMIT:-50}
    volumes:
      - /volume1/docker/fitlog/data:/app/data
      - /volume1/docker/fitlog/config:/app/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:51881/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
