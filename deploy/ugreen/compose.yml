name: fitlog-nas
services:
  fitlog:
    image: ghcr.io/ruymin/fitlog:${FITLOG_IMAGE_TAG:-latest}
    platform: linux/amd64
    user: "10001:10001"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "51881", "--workers", "1"]
    ports:
      - "51881:51881"
    environment:
      FITLOG_DATA_DIR: /app/data
      GOOGLE_SERVICE_ACCOUNT_FILE: /app/config/google-service-account.json
      GOOGLE_SPREADSHEET_ID: ${GOOGLE_SPREADSHEET_ID:?Set GOOGLE_SPREADSHEET_ID in .env}
    volumes:
      - /volume1/docker/fitlog/data:/app/data
      - /volume1/docker/fitlog/config:/app/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:51881/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
