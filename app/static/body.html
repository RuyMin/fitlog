<header class="topbar"><div><p id="today" class="date"></p><h1>몸</h1></div><div class="topbar-actions"><span id="server-status" class="status" role="status">서버 확인 중</span><a class="profile-link" href="/settings" aria-label="설정과 계정"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></a></div></header>
<p id="notice" role="status" aria-live="polite"></p>

<a class="body-card" href="/body-metrics" aria-labelledby="weight-title">
<div class="body-card-head"><h2 id="weight-title">체중</h2><span id="weight-when"></span></div>
<div class="body-weight"><div class="body-big"><strong id="weight-now" class="num">–</strong><span id="weight-change" class="num"></span></div><svg id="weight-spark" viewBox="0 0 180 56" role="img" aria-label="최근 3개월 체중"></svg></div>
<div class="body-comp"><span>골격근 <b id="muscle-now" class="num">–</b> kg <i id="muscle-change" class="num"></i></span><span>체지방 <b id="fat-now" class="num">–</b> % <i id="fat-change" class="num"></i></span></div>
</a>

<a class="body-card" href="/sleep" aria-labelledby="sleep-title">
<div class="body-card-head"><h2 id="sleep-title">수면</h2><span id="sleep-average"></span></div>
<div class="body-sleep"><div class="body-big"><small>어젯밤</small><strong id="sleep-last" class="num">–</strong><span id="sleep-goal-note"></span></div><div id="sleep-bars" class="body-bars" aria-hidden="true"></div></div>
</a>

<a class="body-card body-stats" href="/statistics"><span class="body-stats-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M6 15l4-5 4 3 5-7"></path></svg></span><span class="body-stats-text"><strong>운동 통계</strong><span id="stats-line">이번 달 운동을 불러오는 중</span></span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>

<div class="body-actions"><button type="button" data-quick="weight">+ 체중 기록</button><button type="button" data-quick="sleep">+ 수면 기록</button></div>

<p id="pwa-note" class="muted pwa-note" role="status"></p>
