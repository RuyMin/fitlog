<header class="topbar"><div><p id="today" class="date"></p><h1>몸 · 추이</h1></div><div class="topbar-actions"><span id="server-status" class="status" role="status">서버 확인 중</span><a class="profile-link" href="/settings" aria-label="설정과 계정"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></a></div></header>

<div class="period" role="group" aria-label="기간">
<button type="button" data-days="30" aria-pressed="false">1개월</button>
<button type="button" data-days="90" aria-pressed="true">3개월</button>
<button type="button" data-days="365" aria-pressed="false">1년</button>
</div>
<p id="notice" role="status" aria-live="polite"></p>

<section class="card composition" aria-labelledby="composition-title">
<div class="section-heading"><h2 id="composition-title">체성분</h2><span id="measured-at"></span></div>
<div id="composition-rows" class="composition-rows"></div>
<p class="composition-note">막대는 선택한 기간의 <strong>최저~최고 사이에서 지금 위치</strong>예요. 의학적 표준치가 아니며, 변화량은 직전 측정과 비교한 값이에요.</p>
<a class="card-action" href="/body-metrics#new"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>측정 추가</a>
</section>

<section class="card trends" aria-labelledby="trend-title">
<div class="section-heading"><h2 id="trend-title">변화</h2><span id="trend-range"></span></div>
<div id="trend-charts" class="trend-charts"></div>
</section>

<section class="card sleep-week" aria-labelledby="sleep-title">
<div class="section-heading"><h2 id="sleep-title">수면</h2><span id="sleep-note"></span></div>
<div class="sleep-bars" id="sleep-bars"><span class="sleep-goal-line" id="sleep-goal-line" hidden></span></div>
<a class="card-action" href="/sleep#new"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>수면 기록</a>
</section>
