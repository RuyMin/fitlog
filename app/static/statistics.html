</head><body>

<aside class="sidebar">

<p class="brand-caption">나를 알아가는 작은 기록</p>
<nav class="navigation" aria-label="주 메뉴">

<a href="/#record" class="nav-record"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg><span>기록하기</span></a>
<a href="/meals" data-nav="/meals"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M16 3c-2 1.5-2.5 5-1 8h2v10"></path></svg><span>식단</span></a>

<a href="/settings" data-nav="/settings" class="nav-settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"></path></svg><span>설정</span></a>

<p class="sidebar-footer">나의 건강 기록<br><span>한 번에 하루씩, 나의 속도로.</span></p>
</aside>
<main id="main" class="stats-page">
<header class="rec-head"><a href="/body" class="rec-back" aria-label="몸으로"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a><h1>운동 통계</h1><span id="server-status" class="status" role="status" hidden>서버 확인 중</span><button type="button" id="filter-open" class="stats-filter" aria-label="필터: 날짜 직접 고르기, 체크 안 한 세트"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg><span id="filter-dot" hidden></span></button></header>
<div class="stats-periods" role="tablist" aria-label="기간"><button type="button" role="tab" data-period="week">주</button><button type="button" role="tab" data-period="month">월</button><button type="button" role="tab" data-period="quarter">3개월</button><button type="button" role="tab" data-period="year">1년</button></div>
<p id="notice" role="status" aria-live="polite"></p>
<section class="stats-card" aria-labelledby="headline"><p id="range-label" class="stats-range"></p><h2 id="headline" class="stats-headline">불러오는 중…</h2><div id="kpis" class="stats-kpis"></div><p id="kpi-note" class="stats-kpi-note"></p></section>
<section class="stats-card" aria-labelledby="bars-title"><div class="stats-card-head"><h2 id="bars-title">세트</h2><button type="button" class="stats-help-button" aria-expanded="false" aria-controls="bars-help" aria-label="세트 수 세는 법">?</button></div><p id="bars-help" class="stats-help" hidden>체크한 세트만 셉니다(필터에서 바꿀 수 있어요). 주는 월요일부터 일요일까지예요.</p><div id="bars" class="stats-bars"></div></section>
<section class="stats-card" aria-labelledby="parts-title"><div class="stats-card-head"><h2 id="parts-title">부위별 균형</h2><button type="button" class="stats-help-button" aria-expanded="false" aria-controls="parts-help" aria-label="부위 나누는 법">?</button></div><p id="parts-help" class="stats-help" hidden>종목의 운동 부위로 세트를 나눠요. 기본 종목은 목록의 부위, 내 종목은 내가 고른 부위를 따릅니다.</p><div id="parts"></div><a id="neglect" class="stats-neglect" href="/workouts" hidden></a></section>
<section class="stats-card" aria-labelledby="lifts-title"><div class="stats-card-head"><h2 id="lifts-title">종목별 최고 무게</h2><span>기간 처음 → 지금</span></div><div id="lifts"></div></section>
<dialog id="filter-dialog" class="quick-sheet" aria-labelledby="filter-title">
<form id="filter-form" class="quick-form"><div class="quick-grip"></div><div class="quick-head"><h2 id="filter-title">필터</h2><button type="button" class="quick-close" data-close aria-label="닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
<p class="stats-filter-label">기간 직접 고르기</p>
<div class="stats-dates"><label>시작<input type="date" name="date_from"></label><span aria-hidden="true">~</span><label>끝<input type="date" name="date_to"></label></div>
<p class="stats-filter-note">비워 두면 위의 기간 탭을 따라요 · 최대 1년</p>
<label class="stats-switch"><span><strong>체크 안 한 세트도 세기</strong><small>끝내기 전에 저장한 계획 세트까지 포함해요</small></span><input type="checkbox" name="include_incomplete" role="switch"></label>
<p class="form-error" role="alert"></p>
<div class="quick-actions"><button type="button" id="filter-reset" class="quick-delete stats-reset">처음대로</button><button type="submit" class="quick-save">적용</button></div>
</form>
</dialog>
<p id="pwa-note" class="muted pwa-note" role="status"></p>
<noscript>이 화면은 JavaScript를 켜야 볼 수 있어요.</noscript>
</main></body></html>
