name: Test and publish FitLog

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fitlog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/ruymin/fitlog
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build Linux amd64 image
        run: |
          docker build --platform linux/amd64 \
            --label org.opencontainers.image.source=https://github.com/RuyMin/fitlog \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --tag "$IMAGE:sha-$GITHUB_SHA" --tag "$IMAGE:latest" .
      - name: Smoke test without credentials or existing data
        run: |
          docker run -d --name fitlog-smoke \
            --tmpfs /app/data:uid=10001,gid=10001,mode=0770 "$IMAGE:sha-$GITHUB_SHA"
          for attempt in $(seq 1 30); do
            if docker exec fitlog-smoke python -c 'import json,urllib.request; base="http://127.0.0.1:8080"; assert json.load(urllib.request.urlopen(base+"/api/health"))["status"]=="ok"; assert not json.load(urllib.request.urlopen(base+"/api/sync/status"))["configured"]'; then
              exit 0
            fi
            sleep 2
          done
          docker logs fitlog-smoke
          exit 1
      - name: Remove smoke container
        if: always()
        run: docker rm -f fitlog-smoke || true
      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish tested image
        run: |
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"
          echo "Published $IMAGE:sha-$GITHUB_SHA and $IMAGE:latest (linux/amd64)." >> "$GITHUB_STEP_SUMMARY"
      - name: Sign out
        if: always()
        run: docker logout ghcr.io
